# TEMPLATE -- committed with placeholders, never with real values.
#
# Apply a filled-in copy that is NOT in git:
#   cp k8s/20-secret.example.yaml /tmp/secret.yaml   # edit, then:
#   kubectl apply -f /tmp/secret.yaml
#
# Or generate it without a file touching disk at all, which is what the
# README shows -- `kubectl create secret generic` with --from-literal.
#
# stringData (not data) so values are written in plain text and Kubernetes
# base64-encodes them. base64 is encoding, not encryption: a Secret is only
# meaningfully protected by RBAC and, in a real cluster, encryption at rest.
# That is exactly why this file ships with placeholders and the real one is
# generated per environment.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: agent-hub
type: Opaque
stringData:
  DB_USERNAME: hub_user
  DB_PASSWORD: REPLACE_ME
  # Must be >= 256 bits for HS256 -- JwtService rejects anything shorter at
  # startup rather than running with a weak signing key.
  #   python -c "import secrets;print(secrets.token_urlsafe(48))"
  JWT_SECRET: REPLACE_ME_AT_LEAST_32_BYTES
  # AES-256-GCM key for vendor credentials at rest. The application refuses to
  # start on the placeholder default (LocalAesGcmCredentialEncryptor), so a
  # deployment cannot accidentally encrypt real tokens with a known key.
  #   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
  CREDENTIAL_LOCAL_KEY: REPLACE_ME_BASE64_32_BYTES
  # Only needed for the sandboxed tools (git_clone, run_shell_command...).
  # Unlike LLM keys -- which are per-user and supplied by each user -- this one
  # is server-wide, so every tool-using run in the cluster draws on this single
  # account. Scope it accordingly before exposing an instance publicly.
  E2B_API_KEY: REPLACE_ME
