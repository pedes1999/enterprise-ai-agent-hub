<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Register</h1>
    <p class="subtitle">Create your organization</p>

    <label for="tenantName">Organization name</label>
    <input id="tenantName" type="text" formControlName="tenantName" autocomplete="organization" />

    <label for="tenantSlug">Organization slug</label>
    <input id="tenantSlug" type="text" formControlName="tenantSlug" autocomplete="off" />

    <label for="email">Admin email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create organization' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
