server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular client-side routing -- any path that isn't a real static file
  # falls back to index.html so refreshing on e.g. /agents/foo/trigger works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
