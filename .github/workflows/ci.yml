name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    # write is only actually used by the badge-commit step below, and only on
    # a push to master -- needed regardless so that step has the permission
    # available when its own `if` lets it run.
    permissions:
      contents: write
    services:
      # Started as the default postgres superuser, matching docker/postgres/init.sh's
      # assumption -- the "create hub_user" step below then mirrors that script so
      # tests run against the same non-superuser role prod does (superuser bypasses
      # RLS entirely, which would silently hide a real RLS bug from these tests).
      postgres:
        # pgvector/pgvector, not plain postgres: rag-service's
        # V28__enable_pgvector.sql runs CREATE EXTENSION vector, and the
        # stock image doesn't ship the extension binary at all -- the
        # migration fails with "extension \"vector\" is not available"
        # (IF NOT EXISTS doesn't help; it only suppresses "already exists"),
        # taking every gateway-api integration test down with it. Same image
        # docker-compose.yml uses, for the same reason.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create app role and test database
        # See docker/postgres/init.sh -- gateway-api's tests connect as
        # hub_user/password against agent_hub_test (application-test.yml),
        # never as the postgres superuser. Two separate -c flags, not one
        # semicolon-joined string: psql sends a multi-statement -c string as
        # a single simple-query message, which Postgres implicitly wraps in
        # one transaction block -- and CREATE DATABASE cannot run inside a
        # transaction block, so the combined form always failed here.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE ROLE hub_user LOGIN PASSWORD 'password';" \
            -c "CREATE DATABASE agent_hub_test OWNER hub_user;"
          # As the superuser, and only here -- hub_user owns agent_hub_test
          # but still gets "permission denied to create extension", so
          # V28 can only ever confirm the extension is already present,
          # never install it. Mirrors docker/postgres/init.sh, which does
          # exactly this for the docker-compose path.
          PGPASSWORD=postgres psql -h localhost -U postgres -d agent_hub_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: mvn test
        run: mvn -B -ntp test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/agent_hub_test

      - name: Generate coverage badge
        # Reads each module's jacoco.csv (report goal emits csv alongside
        # html/xml by default -- see the jacoco-maven-plugin block in the
        # root pom.xml) and appends a coverage table to this run's job
        # summary. common-dto is omitted: it has no tests, so it has no
        # jacoco.csv to read.
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: >
            agent-core/target/site/jacoco/jacoco.csv
            agent-runtime/target/site/jacoco/jacoco.csv
            rag-service/target/site/jacoco/jacoco.csv
            gateway-api/target/site/jacoco/jacoco.csv

      - name: Commit updated coverage badge
        # Only on a real push to master, never on a PR -- a PR from a fork
        # can't be granted contents:write, and committing a badge update
        # into every PR branch would just be noise on top of that.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge [skip ci]"
          file_pattern: ".github/badges/*.svg"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build -- --configuration production
      # --omit=dev: dev-only tooling (Angular CLI, karma, etc.) has a much
      # larger and noisier vuln surface than what actually ships; --audit-level
      # high so a moderate finding in some transitive dep doesn't block every push.
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    # Diffs the dependency graph against base and flags newly-introduced
    # vulnerable/disallowed packages -- only meaningful on a PR, which is why
    # this isn't just another step in backend/frontend (those run on push too).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: gateway-api
            context: .
            dockerfile: gateway-api/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: sidecar
            context: agent-runtime/sidecar
            dockerfile: agent-runtime/sidecar/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Exercises every layer (incl. the Maven/npm build stages) without
          # needing to `docker load` the result anywhere -- this job only
          # needs to know the image builds, not to keep the artifact around.
