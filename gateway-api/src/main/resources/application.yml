spring:
  application:
    name: enterprise-ai-agent-hub-gateway

  datasource:
    # Never commit real credentials. Pull from env vars / secret manager in every environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_hub}
    username: ${DB_USERNAME:hub_user}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema. Hibernate only ever validates it matches, never generates DDL.
    properties:
      hibernate:
        format_sql: false
    open-in-view: false     # Avoid lazy-loading traps outside the transaction boundary

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # The migration user needs CREATE/ALTER privileges. This can be the same
    # role the app runs as, as long as that role is NOT superuser/BYPASSRLS
    # (see the note at the bottom of V1__init_schema.sql) -- otherwise RLS
    # policies get silently ignored for every query the app makes.

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:REPLACE_ME_WITH_A_STRONG_SECRET_FROM_VAULT}
    jwt-expiration-minutes: 60
  execution:
    # Thread pool backing @Async agent execution triggers -- unused
    # placeholder, see GatewayApplication's javadoc. Real job orchestration
    # is AgentJobWorker's DB-backed poll loop, not this.
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 100
    # Per-tenant concurrency cap: AgentExecutionService.enqueue() rejects
    # (429, not a silent queue) once a tenant already has this many
    # QUEUED+RUNNING executions. Protects a metered E2B/Anthropic account
    # from a bug, a misbehaving agent loop, or repeated clicking -- not a
    # tenant-tier setting yet, just a single low default everyone shares.
    max-concurrent-per-tenant: ${MAX_CONCURRENT_EXECUTIONS_PER_TENANT:5}
  credentials:
    # Placeholder for the encryption key used to encrypt vendor API tokens at rest.
    # In production this comes from AWS KMS / HashiCorp Vault, never from application.yml directly.
    encryption-key-provider: ${CREDENTIAL_KMS_PROVIDER:local-dev-only}
    # Base64 AES-256 key used by LocalAesGcmCredentialEncryptor to encrypt
    # every tenant's vendor/tool credentials at rest. Deliberately an
    # obvious, non-functional placeholder -- NOT a real working key, unlike
    # an earlier version of this line -- so an environment that forgets to
    # set CREDENTIAL_LOCAL_KEY fails loudly at startup (see
    # LocalAesGcmCredentialEncryptor's constructor) instead of silently
    # encrypting every tenant's secrets with a key sitting in plaintext in
    # the source tree. Same fail-closed pattern as jwt-secret above.
    # Generate a real one with:
    #   python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
    local-key: ${CREDENTIAL_LOCAL_KEY:REPLACE_ME_WITH_A_STRONG_KEY_FROM_VAULT}
  llm:
    # Not the langchain4j-bundled AnthropicChatModelName enum -- see
    # LlmProperties javadoc. Override via env var as Anthropic ships newer
    # models; the API accepts any valid model id string.
    anthropic-model-name: ${ANTHROPIC_MODEL_NAME:claude-sonnet-4-5-20250929}
  sandbox:
    # Points at agent-runtime/sidecar (see its README) -- must be running
    # separately (node --env-file=.env server.js, or the Dockerfile) for
    # any sandboxed AgentTool (e.g. RunShellCommandTool) to work.
    sidecar-url: ${SANDBOX_SIDECAR_URL:http://localhost:8090/}
  job-worker:
    # AgentJobWorker's poll loop against agent_executions (POST
    # /agents/execute enqueues, this picks it up). Disabled in
    # application-test.yml so integration tests don't race a background
    # poller against rows they're asserting on.
    enabled: ${JOB_WORKER_ENABLED:true}
    poll-interval-ms: ${JOB_WORKER_POLL_INTERVAL_MS:2000}

logging:
  level:
    com.enterprisehub: INFO
    org.springframework.security: INFO
