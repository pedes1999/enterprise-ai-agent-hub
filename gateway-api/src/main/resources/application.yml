spring:
  application:
    name: enterprise-ai-agent-hub-gateway

  datasource:
    # Never commit real credentials. Pull from env vars / secret manager in every environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_hub}
    username: ${DB_USERNAME:hub_user}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema. Hibernate only ever validates it matches, never generates DDL.
    properties:
      hibernate:
        format_sql: false
    open-in-view: false     # Avoid lazy-loading traps outside the transaction boundary

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # The migration user needs CREATE/ALTER privileges. This can be the same
    # role the app runs as, as long as that role is NOT superuser/BYPASSRLS
    # (see the note at the bottom of V1__init_schema.sql) -- otherwise RLS
    # policies get silently ignored for every query the app makes.

  mail:
    # Brevo's SMTP relay -- backs MailService's temp-password emails for
    # admin-created team members (see UserService.create()). username is
    # the Brevo account login, distinct from BREVO_SMTP_KEY (the SMTP
    # password/API key) -- Brevo's SMTP relay requires both, not just one.
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME:REPLACE_ME_WITH_BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY:REPLACE_ME_WITH_BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  health:
    # Mail is optional (only backs team-invite emails, see MailService) --
    # an unreachable/misconfigured SMTP relay shouldn't fail /actuator/health
    # for the whole app, which docker-compose's frontend service depends on
    # via condition: service_healthy.
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:REPLACE_ME_WITH_A_STRONG_SECRET_FROM_VAULT}
    jwt-expiration-minutes: 60
  execution:
    # Thread pool backing @Async agent execution triggers -- unused
    # placeholder, see GatewayApplication's javadoc. Real job orchestration
    # is AgentJobWorker's DB-backed poll loop, not this.
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 100
    # Per-tenant concurrency cap: AgentExecutionService.enqueue() rejects
    # (429, not a silent queue) once a tenant already has this many
    # QUEUED+RUNNING executions. Protects a metered E2B/Anthropic account
    # from a bug, a misbehaving agent loop, or repeated clicking -- not a
    # tenant-tier setting yet, just a single low default everyone shares.
    max-concurrent-per-tenant: ${MAX_CONCURRENT_EXECUTIONS_PER_TENANT:5}
  credentials:
    # Placeholder for the encryption key used to encrypt vendor API tokens at rest.
    # In production this comes from AWS KMS / HashiCorp Vault, never from application.yml directly.
    encryption-key-provider: ${CREDENTIAL_KMS_PROVIDER:local-dev-only}
    # Base64 AES-256 key used by LocalAesGcmCredentialEncryptor to encrypt
    # every tenant's vendor/tool credentials at rest. Deliberately an
    # obvious, non-functional placeholder -- NOT a real working key, unlike
    # an earlier version of this line -- so an environment that forgets to
    # set CREDENTIAL_LOCAL_KEY fails loudly at startup (see
    # LocalAesGcmCredentialEncryptor's constructor) instead of silently
    # encrypting every tenant's secrets with a key sitting in plaintext in
    # the source tree. Same fail-closed pattern as jwt-secret above.
    # Generate a real one with:
    #   python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
    local-key: ${CREDENTIAL_LOCAL_KEY:REPLACE_ME_WITH_A_STRONG_KEY_FROM_VAULT}
  llm:
    # Whole-instance switch between ANTHROPIC (default) and LOCAL (any
    # OpenAI-compatible server on this machine -- Ollama, LM Studio, vLLM).
    # See LlmProperties javadoc. Not per-tenant/per-execution.
    provider: ${LLM_PROVIDER:ANTHROPIC}
    # Not the langchain4j-bundled AnthropicChatModelName enum -- see
    # LlmProperties javadoc. Override via env var as Anthropic ships newer
    # models; the API accepts any valid model id string.
    anthropic-model-name: ${ANTHROPIC_MODEL_NAME:claude-sonnet-4-5-20250929}
    # Same idea, for OPENAI/GEMINI -- overridable per tenant regardless (see
    # TenantSettingsService.preferredModelName).
    openai-model-name: ${OPENAI_MODEL_NAME:gpt-4o-mini}
    gemini-model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
    # Only read when provider=LOCAL. Must match a model already pulled in
    # your local server (e.g. `ollama pull llama3.1`).
    local-model-name: ${LLM_LOCAL_MODEL_NAME:llama3.1}
    # Only read when provider=LOCAL. Defaults to Ollama's standard address
    # if left unset -- see LlmEngineFactory.
    local-base-url: ${LLM_LOCAL_BASE_URL:http://localhost:11434/v1}
    # Server-wide fallback token budget per execution -- ToolCallingChatEngine
    # forces a final answer once a run's cumulative TokenUsage crosses this,
    # same idea as maxToolRounds but priced in tokens instead of rounds. A
    # tenant can override it (TenantSettingsService), and a single trigger
    # request can override THAT (TriggerAgentExecutionRequest.maxTokens) --
    # see TenantLlmProviderResolver.resolveMaxTokens().
    #
    # 500,000 (the original default) is too tight for test-fixer/ticket-resolver:
    # ToolCallingChatEngine resends the FULL conversation history on every
    # round, so cumulative billed tokens across a long run grow roughly with
    # the SQUARE of the round count, not linearly -- a genuine 100-round
    # monorepo run (the exact shape DEFAULT_MAX_TOOL_ROUNDS=100 was raised
    # for, see its javadoc) can plausibly bill several million cumulative
    # tokens well before any single call approaches the model's own context
    # window. Raised well above that so the budget catches a runaway/
    # misconfigured tenant, not a legitimately deep task -- tightening this
    # further should wait on trimming/summarizing old tool results out of
    # the resent history (not yet built), not just a smaller number here.
    max-tokens-per-execution: ${MAX_TOKENS_PER_EXECUTION:3000000}
    # Overrides ToolCallingChatEngine.DEFAULT_MAX_TOOL_ROUNDS (100) -- see
    # LlmProperties' javadoc. No tenant/execution-level override yet, unlike
    # max-tokens-per-execution above -- this is a runaway-loop backstop, not
    # a per-run cost dial.
    max-tool-rounds: ${MAX_TOOL_ROUNDS:100}
  sandbox:
    # Points at agent-runtime/sidecar (see its README) -- must be running
    # separately (node --env-file=.env server.js, or the Dockerfile) for
    # any sandboxed AgentTool (e.g. RunShellCommandTool) to work.
    sidecar-url: ${SANDBOX_SIDECAR_URL:http://localhost:8090/}
  cors:
    # The Angular frontend is a genuine cross-origin browser client (its own
    # nginx container/Deployment/origin, deployed independently of this
    # module) -- every caller before it was non-browser (Postman, CI), so
    # this never needed to exist until now. Deliberately ONE explicit
    # origin, never a wildcard -- see SecurityConfig's corsConfigurationSource().
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  job-worker:
    # AgentJobWorker's poll loop against agent_executions (POST
    # /agents/execute enqueues, this picks it up). Disabled in
    # application-test.yml so integration tests don't race a background
    # poller against rows they're asserting on.
    enabled: ${JOB_WORKER_ENABLED:true}
    poll-interval-ms: ${JOB_WORKER_POLL_INTERVAL_MS:2000}
  mail:
    # Must be a sender address verified in the Brevo account above, or
    # Brevo rejects the send outright.
    from-address: ${MAIL_FROM_ADDRESS:REPLACE_ME_WITH_A_BREVO_VERIFIED_SENDER}

logging:
  level:
    com.enterprisehub: INFO
    org.springframework.security: INFO
