spring:
  datasource:
    # Integration tests get their own database so test runs never create or
    # pollute data in the same DB used for manual/dev testing. Same
    # hub_user/password, same host -- just a different database name.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/agent_hub_test}

app:
  job-worker:
    # AgentJobWorker's bean is entirely absent (see its
    # @ConditionalOnProperty) when this is false -- @SpringBootTest
    # integration tests assert on agent_executions rows directly and must
    # not have a background poller claiming/mutating them concurrently.
    enabled: false
  credentials:
    # application.yml's default is now a deliberate non-functional
    # placeholder (see its comment) that LocalAesGcmCredentialEncryptor
    # rejects at startup -- @SpringBootTest integration tests that boot the
    # real Spring context need a real (if test-only) 32-byte key here, or
    # context loading fails for every one of them. Freshly generated,
    # committed only because it's test-only and never protects anything
    # real -- never reuse this value (or copy this pattern) for an actual
    # deployment's CREDENTIAL_LOCAL_KEY.
    local-key: Pe2FHA6ZfpQW7AsD8eraRLuBv7gImE4fYZGA+cL/dlw=

  rate-limit:
    # Left ON so the filter is genuinely in the chain for @SpringBootTest, but
    # with a ceiling no test run can reach. Integration tests deliberately
    # burst the unauthenticated routes -- registering a tenant per test from
    # one address -- and a production-shaped limit would turn that into
    # flakiness that grows with the suite rather than a meaningful signal.
    # The filter's actual behaviour is pinned by RateLimitFilterTest, which
    # drives it directly at real limits.
    requests: 1000000
